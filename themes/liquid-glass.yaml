Liquid Glass:
  # ==== Accent ====
  primary-color: "#007aff"
  accent-color: "#30d158"
  app-header-background-color: var(--ha-card-background)
  app-header-text-color: var(--primary-text-color)
  # Dashboard header: blurred like the cards, so content scrolling under it is frosted
  app-header-backdrop-filter: "blur(22px) saturate(180%)"

  # ==== Frosted-glass cards (light and dark) ====
  ha-card-border-radius: "22px"
  ha-card-border-width: "1px"
  ha-card-backdrop-filter: "blur(22px) saturate(180%)"
  mdc-shape-medium: "22px"

  # ==== Modes ====
  modes:
    light:
      # Background: gray gradient
      lovelace-background: "linear-gradient(160deg, #eceef1 0%, #d9dbe0 55%, #c7cad1 100%)"
      primary-background-color: "#dcdee3"
      secondary-background-color: "rgba(233, 238, 245, 0.96)"
      divider-color: "rgba(0, 0, 0, 0.08)"

      # Translucent cards
      card-background-color: "#f3f4f6"
      ha-card-background: "rgba(255, 255, 255, 0.72)"
      ha-card-border-color: "rgba(255, 255, 255, 0.6)"
      ha-card-box-shadow: "0 8px 30px rgba(0, 0, 0, 0.12)"

      # Dialogs / more-info: nearly opaque surface over a blurred background, to stay readable
      ha-dialog-surface-background: "rgba(246, 247, 249, 0.92)"
      dialog-backdrop-filter: "blur(14px) saturate(140%)"
      mdc-dialog-scrim-color: "rgba(0, 0, 0, 0.28)"

      # Text readable on light glass
      primary-text-color: "#1c1c1e"
      secondary-text-color: "rgba(28, 28, 30, 0.6)"
      # Text on the accent (buttons, badges): white, as Apple and Home Assistant
      text-primary-color: "#ffffff"
      disabled-text-color: "rgba(28, 28, 30, 0.35)"
      state-icon-color: "#1c1c1e"
      rgb-primary-text-color: "28, 28, 30"

      # Side panel (glass, readable)
      sidebar-background-color: "rgba(255, 255, 255, 0.5)"
      sidebar-text-color: "rgba(28, 28, 30, 0.75)"
      sidebar-icon-color: "rgba(28, 28, 30, 0.6)"
      sidebar-selected-text-color: "#007aff"
      sidebar-selected-icon-color: "#007aff"

      # Status palette of the ha-* cards, as in ha-neutral (green OK, amber active, blue open,
      # cyan cold, purple media, red alert, gray idle): >= 4.5:1 as text on the light glass
      # card and its inner tiles (checked by the Validate workflow).
      # Home Assistant's state colors derive from these.
      green-color: "#1a7a3d"
      amber-color: "#945f09"
      orange-color: "#a95204"
      yellow-color: "#826705"
      blue-color: "#2360e8"
      light-blue-color: "#176db5"
      cyan-color: "#077489"
      teal-color: "#05786a"
      purple-color: "#7c4dcc"
      deep-purple-color: "#6741b8"
      red-color: "#c53030"
      grey-color: "#666b73"
      success-color: "#1a7a3d"
      warning-color: "#945f09"
      error-color: "#c53030"
      info-color: "#2360e8"
      state-icon-active-color: "#007aff"
      rgb-primary-color: "0, 122, 255"
      rgb-accent-color: "48, 209, 88"
      rgb-green-color: "26, 122, 61"
      rgb-amber-color: "148, 95, 9"
      rgb-orange-color: "169, 82, 4"
      rgb-yellow-color: "130, 103, 5"
      rgb-blue-color: "35, 96, 232"
      rgb-light-blue-color: "23, 109, 181"
      rgb-cyan-color: "7, 116, 137"
      rgb-teal-color: "5, 120, 106"
      rgb-purple-color: "124, 77, 204"
      rgb-deep-purple-color: "103, 65, 184"
      rgb-red-color: "197, 48, 48"
      rgb-grey-color: "102, 107, 115"
      rgb-success-color: "26, 122, 61"
      rgb-warning-color: "148, 95, 9"
      rgb-error-color: "197, 48, 48"
      rgb-info-color: "35, 96, 232"

    dark:
      # Accent: Apple's dark-mode blue, as the selected side-panel item
      primary-color: "#0a84ff"

      # Background: gray gradient
      lovelace-background: "linear-gradient(160deg, #2b2c30 0%, #1d1e21 55%, #121316 100%)"
      primary-background-color: "#1d1e21"
      # Inner tiles: a light veil on the glass card, low enough for status colors to stay readable
      secondary-background-color: "rgba(255, 255, 255, 0.08)"
      divider-color: "rgba(255, 255, 255, 0.1)"

      # Translucent cards
      card-background-color: "#26282c"
      ha-card-background: "rgba(58, 60, 66, 0.72)"
      ha-card-border-color: "rgba(255, 255, 255, 0.12)"
      ha-card-box-shadow: "0 8px 30px rgba(0, 0, 0, 0.45)"

      # Dialogs / more-info: nearly opaque surface over a blurred background, to stay readable
      ha-dialog-surface-background: "rgba(32, 34, 38, 0.94)"
      dialog-backdrop-filter: "blur(14px) saturate(140%)"
      mdc-dialog-scrim-color: "rgba(0, 0, 0, 0.55)"

      # Text readable on dark glass
      primary-text-color: "#f5f5f7"
      secondary-text-color: "rgba(235, 235, 245, 0.8)"
      text-primary-color: "#f5f5f7"
      disabled-text-color: "rgba(235, 235, 245, 0.35)"
      state-icon-color: "#f5f5f7"
      rgb-primary-text-color: "245, 245, 247"

      # Side panel (glass, readable)
      sidebar-background-color: "rgba(40, 42, 46, 0.55)"
      sidebar-text-color: "rgba(235, 235, 245, 0.8)"
      sidebar-icon-color: "rgba(235, 235, 245, 0.6)"
      sidebar-selected-text-color: "#0a84ff"
      sidebar-selected-icon-color: "#0a84ff"

      # Status palette of the ha-* cards, as in ha-neutral, brightened for dark glass:
      # >= 4.5:1 as text on the dark glass card and its inner tiles.
      green-color: "#5fd08a"
      amber-color: "#f2b84b"
      orange-color: "#ffa05a"
      yellow-color: "#e8cf5a"
      blue-color: "#86baff"
      light-blue-color: "#8bd0ff"
      cyan-color: "#5cc8e0"
      teal-color: "#4fd1bd"
      purple-color: "#d0bfff"
      deep-purple-color: "#bdabff"
      red-color: "#ff9c98"
      grey-color: "#b2b8be"
      success-color: "#5fd08a"
      warning-color: "#f2b84b"
      error-color: "#ff9c98"
      info-color: "#86baff"
      state-icon-active-color: "#0a84ff"
      rgb-primary-color: "10, 132, 255"
      rgb-accent-color: "48, 209, 88"
      rgb-green-color: "95, 208, 138"
      rgb-amber-color: "242, 184, 75"
      rgb-orange-color: "255, 160, 90"
      rgb-yellow-color: "232, 207, 90"
      rgb-blue-color: "134, 186, 255"
      rgb-light-blue-color: "139, 208, 255"
      rgb-cyan-color: "92, 200, 224"
      rgb-teal-color: "79, 209, 189"
      rgb-purple-color: "208, 191, 255"
      rgb-deep-purple-color: "189, 171, 255"
      rgb-red-color: "255, 156, 152"
      rgb-grey-color: "178, 184, 190"
      rgb-success-color: "95, 208, 138"
      rgb-warning-color: "242, 184, 75"
      rgb-error-color: "255, 156, 152"
      rgb-info-color: "134, 186, 255"
