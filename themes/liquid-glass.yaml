Liquid Glass:
  # ==== Accent ====
  primary-color: "#007aff"
  accent-color: "#30d158"
  app-header-background-color: var(--ha-card-background)
  app-header-text-color: var(--primary-text-color)

  # ==== Carte « verre dépoli » (commun clair/sombre) ====
  ha-card-border-radius: "22px"
  ha-card-border-width: "1px"
  ha-card-backdrop-filter: "blur(22px) saturate(180%)"
  mdc-shape-medium: "22px"

  # ==== Modes ====
  modes:
    light:
      # Fond : dégradé gris
      lovelace-background: "linear-gradient(160deg, #eceef1 0%, #d9dbe0 55%, #c7cad1 100%)"
      primary-background-color: "#dcdee3"
      secondary-background-color: "rgba(255, 255, 255, 0.55)"
      divider-color: "rgba(0, 0, 0, 0.08)"

      # Cartes translucides
      card-background-color: "rgba(255, 255, 255, 0.45)"
      ha-card-background: "rgba(255, 255, 255, 0.45)"
      ha-card-border-color: "rgba(255, 255, 255, 0.6)"
      ha-card-box-shadow: "0 8px 30px rgba(0, 0, 0, 0.12)"

      # Texte lisible sur verre clair
      primary-text-color: "#1c1c1e"
      secondary-text-color: "rgba(28, 28, 30, 0.6)"
      text-primary-color: "#1c1c1e"
      disabled-text-color: "rgba(28, 28, 30, 0.35)"
      state-icon-color: "#1c1c1e"

      # Panneau latéral (verre, lisible)
      sidebar-background-color: "rgba(255, 255, 255, 0.5)"
      sidebar-text-color: "rgba(28, 28, 30, 0.75)"
      sidebar-icon-color: "rgba(28, 28, 30, 0.6)"
      sidebar-selected-text-color: "#007aff"
      sidebar-selected-icon-color: "#007aff"

    dark:
      # Fond : dégradé gris
      lovelace-background: "linear-gradient(160deg, #2b2c30 0%, #1d1e21 55%, #121316 100%)"
      primary-background-color: "#1d1e21"
      secondary-background-color: "rgba(255, 255, 255, 0.06)"
      divider-color: "rgba(255, 255, 255, 0.1)"

      # Cartes translucides
      card-background-color: "rgba(60, 62, 68, 0.45)"
      ha-card-background: "rgba(60, 62, 68, 0.45)"
      ha-card-border-color: "rgba(255, 255, 255, 0.12)"
      ha-card-box-shadow: "0 8px 30px rgba(0, 0, 0, 0.45)"

      # Texte lisible sur verre sombre
      primary-text-color: "#f5f5f7"
      secondary-text-color: "rgba(235, 235, 245, 0.6)"
      text-primary-color: "#f5f5f7"
      disabled-text-color: "rgba(235, 235, 245, 0.35)"
      state-icon-color: "#f5f5f7"

      # Panneau latéral (verre, lisible)
      sidebar-background-color: "rgba(40, 42, 46, 0.55)"
      sidebar-text-color: "rgba(235, 235, 245, 0.8)"
      sidebar-icon-color: "rgba(235, 235, 245, 0.6)"
      sidebar-selected-text-color: "#0a84ff"
      sidebar-selected-icon-color: "#0a84ff"
